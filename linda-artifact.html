:root{
  --bg:#FFFFFF; --surface:#FFF4F5; --surface-2:#FBE4E7; --ink:#2A1A20; --muted:#7A5E66; --line:#F1D5DA;
  --red:#D6334A; --red-deep:#B5243A; --kunyit:#E9A12B; --daun:#2F6B4F; --danger:#B42318;
  --card:#FFFFFF; --shadow:0 1px 0 rgba(42,26,32,.06), 0 10px 30px -18px rgba(150,30,50,.35);
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1115; --surface:#24161C; --surface-2:#311F27; --ink:#F8E9EC; --muted:#C6A6AF; --line:#432C35;
    --red:#E64A61; --red-deep:#C7334A; --card:#27181F; --kunyit:#F0B347; --daun:#6FBF95; --danger:#FF8A80;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1115; --surface:#24161C; --surface-2:#311F27; --ink:#F8E9EC; --muted:#C6A6AF; --line:#432C35;
  --red:#E64A61; --red-deep:#C7334A; --card:#27181F; --kunyit:#F0B347; --daun:#6FBF95; --danger:#FF8A80;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
img{max-width:100%; display:block}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--kunyit); outline-offset:2px; border-radius:6px}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
.top .wrap{display:flex; align-items:center; gap:14px; height:68px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--red)}
.brand .mk-woman{width:34px}
.brand .stack{display:flex; flex-direction:column; gap:4px}
.brand .mk-word{width:84px}
.brand .mk-sub{width:110px; color:var(--ink); opacity:.85}
nav.main{display:flex; gap:2px; margin-left:auto}
nav.main a{text-decoration:none; font-weight:600; font-size:15px; padding:8px 12px; border-radius:999px}
nav.main a:hover{background:var(--surface)}
nav.main a[aria-current="page"]{color:var(--red)}
.search-top{display:flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:999px; padding:0 4px 0 14px; height:40px; width:220px}
.search-top input{border:0; background:transparent; outline:none; width:100%; font-size:14.5px}
.search-top button{border:0; background:transparent; cursor:pointer; padding:6px; display:grid; place-items:center; color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer; text-decoration:none; font-weight:700; font-size:15px; border-radius:999px; padding:12px 20px; line-height:1.1; transition:transform .12s, background .15s; white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red); color:#fff}
.btn-red:hover{background:var(--red-deep)}
.btn-white{background:#fff; color:#B5243A}
.btn-white:hover{background:#FFE9EC}
.btn-ghost{background:transparent; color:inherit; box-shadow:inset 0 0 0 1.5px currentColor}
.btn-ghost:hover{background:rgba(127,127,127,.1)}
.btn-wa{background:#1F8F55; color:#fff}
.btn-wa:hover{background:#177646}
.btn-sm{padding:8px 14px; font-size:14px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.wa-ico{width:18px; height:18px; flex:none}
.mnav{display:none}
@media (max-width:900px){ .search-top{display:none} }
@media (max-width:760px){
  nav.main{display:none} .top .btn-wa span{display:none} .top .btn-wa{padding:10px; margin-left:auto}
  .mnav{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
  .mnav a{flex:1; text-align:center; text-decoration:none; font-size:12.5px; font-weight:700; padding:10px 0 12px; color:var(--muted)}
  .mnav a svg{display:block; margin:0 auto 3px; width:22px; height:22px}
  .mnav a[aria-current="page"]{color:var(--red)}
  body{padding-bottom:64px}
}

/* hero / banner utama */
.hero{position:relative; overflow:hidden; background:var(--hb,#D6334A); color:var(--hc,#fff); transition:background .4s}
.hero .wrap{display:grid; grid-template-columns:1.05fr .95fr; gap:24px; align-items:center; min-height:480px}
.hero-copy{padding:56px 0 72px}
.hero .eyebrow{font-weight:700; font-size:14px; opacity:.85; margin-bottom:10px}
.hero h1{font-family:var(--serif); font-weight:400; font-size:clamp(2.3rem,5vw,4.2rem); line-height:1.04; margin:0 0 16px; max-width:14ch; text-wrap:balance}
.hero p.lead{font-size:clamp(1.02rem,1.5vw,1.15rem); max-width:42ch; margin:0 0 28px; opacity:.9}
.hero-art{align-self:stretch; display:flex; align-items:flex-end; justify-content:center; min-height:380px; position:relative}
.hero-art .mk-woman{width:min(100%,420px); margin-bottom:-6px; color:currentColor; opacity:.95}
.hero-art .pic{align-self:center; width:100%; aspect-ratio:4/3; border-radius:28px; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.hero-art .pic img{width:100%; height:100%; object-fit:cover}
.hero-ctrl{position:absolute; left:0; right:0; bottom:22px}
.hero-ctrl .wrap{display:flex; align-items:center; gap:10px; min-height:0}
.hero-ctrl button.dot{width:10px; height:10px; border-radius:50%; border:0; padding:0; background:currentColor; opacity:.35; cursor:pointer}
.hero-ctrl button.dot[aria-current="true"]{opacity:1; width:26px; border-radius:99px}
.hero-ctrl .arr{width:36px; height:36px; border-radius:50%; border:1.5px solid currentColor; background:transparent; cursor:pointer; display:grid; place-items:center; opacity:.8}
.hero-ctrl .arr:first-of-type{margin-left:auto}
@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr; min-height:0}
  .hero-copy{padding:40px 0 4px}
  .hero-art{min-height:260px}
  .hero-art .mk-woman{width:240px; margin-left:auto; margin-right:-10px}
  .hero-art .pic{margin-bottom:60px}
}

/* sections */
section.blk{padding:64px 0 0}
section.blk.last{padding-bottom:72px}
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
h2{font-family:var(--serif); font-weight:400; font-size:clamp(1.7rem,3.2vw,2.5rem); line-height:1.08; margin:0}
.sec-head p{margin:6px 0 0; color:var(--muted); max-width:56ch}
.more{font-weight:700; color:var(--red); text-decoration:none; font-size:15px; background:none; border:0; cursor:pointer; padding:4px 0}
.more:hover{text-decoration:underline}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.tile{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:10px; background:var(--surface); border-radius:22px; padding:16px; transition:transform .15s, background .15s}
.tile:hover{background:var(--surface-2); transform:translateY(-2px)}
.tile:focus-visible{outline:3px solid var(--kunyit); outline-offset:2px}
.tile .ic{width:54px; height:54px; border-radius:16px; display:grid; place-items:center}
.tile .ic svg{width:36px; height:36px}
.tile b{font-size:15.5px; line-height:1.25}
.tile span{font-size:13px; color:var(--muted)}
.brands{display:grid; grid-auto-flow:column; grid-auto-columns:132px; gap:14px; overflow-x:auto; padding-bottom:8px}
.btile{all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.btile .lg{width:112px; height:112px; border-radius:50%; background:var(--card); border:1.5px solid var(--line); display:grid; place-items:center; overflow:hidden; transition:border-color .15s}
.btile:hover .lg{border-color:var(--red)}
.btile:focus-visible .lg{outline:3px solid var(--kunyit); outline-offset:2px}
.btile .lg img{width:100%; height:100%; object-fit:contain; padding:14px; background:#fff}
.btile .lg em{font-style:normal; font-family:var(--serif); font-size:30px; color:var(--red)}
.btile b{font-size:14.5px}

/* product cards */
.rail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(196px,226px); gap:18px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity}
.rail > *{scroll-snap-align:start}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:24px 18px}
.pcard{position:relative; display:flex; flex-direction:column}
.pcard .ph{border-radius:22px; overflow:hidden; aspect-ratio:4/5; position:relative; margin-bottom:12px; background:var(--surface)}
.pcard .bdg{position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.pcard .brandn{font-size:12.5px; color:var(--muted); font-weight:700; letter-spacing:.01em}
.pcard h3{font-size:16px; margin:2px 0 8px; line-height:1.3}
.plink{all:unset; cursor:pointer}
.plink::after{content:""; position:absolute; inset:0; border-radius:22px}
.plink:focus-visible::after{outline:3px solid var(--kunyit); outline-offset:4px}
.pcard .foot{margin-top:auto; display:flex; flex-direction:column; gap:8px}
.pcard .foot .btn{position:relative; z-index:1}
.price{font-weight:800; font-size:16.5px}
.strike{text-decoration:line-through; color:var(--muted); font-size:13.5px; font-weight:600; margin-right:6px}
.badge{font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; line-height:1.2}
.b-promo{background:var(--red); color:#fff}
.b-sp{background:var(--kunyit); color:#3A2400}
.b-habis{background:#2A1A20; color:#fff}
.b-sedikit{background:#fff; color:#8A4B00; box-shadow:inset 0 0 0 1.5px #E9A12B}
.ph img{width:100%; height:100%; object-fit:cover}
.ph svg{width:100%; height:100%; display:block}
.empty{border:2px dashed var(--line); border-radius:24px; padding:36px 22px; text-align:center; color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-size:18px; margin-bottom:4px}

/* sponsor strip */
.sponsor{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(300px,1fr); gap:16px; overflow-x:auto; padding-bottom:8px}
.sp-card{position:relative; background:var(--surface); border-radius:24px; padding:14px; display:grid; grid-template-columns:116px 1fr; gap:14px; align-items:center}
.sp-card .ph{border-radius:16px; overflow:hidden; aspect-ratio:1}
.sp-card h3{font-size:16px; margin:6px 0 4px; line-height:1.25}
.sp-card .btn{position:relative; z-index:1; margin-top:10px}

/* member banner */
.mbanner{background:var(--ink); color:var(--bg); border-radius:32px; padding:40px; display:grid; grid-template-columns:1.2fr .8fr; gap:28px; align-items:center; position:relative; overflow:hidden; isolation:isolate}
.mbanner .mk-woman{position:absolute; right:-20px; bottom:-40px; width:300px; color:var(--red); opacity:.35; z-index:-1}
.mbanner h2{color:inherit}
.mbanner p{opacity:.82; margin:10px 0 22px; max-width:50ch}
.mbanner ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.mbanner li{display:flex; gap:10px; align-items:flex-start; font-weight:600}
.mbanner li::before{content:""; flex:none; width:10px; height:10px; border-radius:50%; background:var(--kunyit); margin-top:.5em}
@media (max-width:760px){ .mbanner{grid-template-columns:1fr; padding:28px} }

/* info toko */
.info{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.info > div{background:var(--surface); border-radius:22px; padding:20px}
.info b{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
.info span, .info a{font-weight:700; font-size:16px; text-decoration:none}
.info a:hover{color:var(--red)}

/* list produk */
.page-head{padding:40px 0 18px}
.page-head h1{font-family:var(--serif); font-weight:400; font-size:clamp(2rem,4vw,3rem); margin:0; line-height:1.05}
.crumb{font-size:14px; color:var(--muted); margin-bottom:10px}
.crumb a{text-decoration:none} .crumb a:hover{color:var(--red)}
.lp{display:grid; grid-template-columns:250px 1fr; gap:32px; padding-bottom:72px; align-items:start}
.filters{position:sticky; top:88px; display:flex; flex-direction:column; gap:18px}
.filters h3{font-size:14px; margin:0 0 8px}
.fopt{display:flex; flex-direction:column; gap:2px; max-height:240px; overflow:auto}
.fopt label{display:flex; gap:10px; align-items:center; padding:6px 8px; border-radius:10px; cursor:pointer; font-size:15px}
.fopt label:hover{background:var(--surface)}
.fopt input{accent-color:var(--red); width:17px; height:17px}
.fopt small{margin-left:auto; color:var(--muted)}
.range{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.lp-top{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:18px}
.active-f{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:1.5px solid var(--line); background:transparent; border-radius:999px; padding:6px 12px; font-weight:600; font-size:14px; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.ftoggle{display:none}
@media (max-width:860px){
  .lp{grid-template-columns:1fr}
  .filters{position:static; display:none; background:var(--surface); border-radius:20px; padding:16px}
  .filters.open{display:flex}
  .ftoggle{display:inline-flex}
}

/* detail */
.det{display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:start; padding-bottom:20px}
.det .ph{border-radius:30px; overflow:hidden; aspect-ratio:1; position:relative; background:var(--surface)}
.det .bdg{position:absolute; top:16px; left:16px; display:flex; gap:8px}
.det-info{display:flex; flex-direction:column; gap:14px; align-items:flex-start; padding-top:8px}
.det-info .brandn{font-weight:800; color:var(--red); text-decoration:none; background:none; border:0; padding:0; cursor:pointer; font-size:15px}
.det-info h1{font-family:var(--serif); font-weight:400; font-size:clamp(2rem,3.6vw,2.8rem); margin:0; line-height:1.08}
.det-info .price{font-size:26px}
.det-info .desc{color:var(--muted); white-space:pre-line; margin:0}
.stok{display:inline-flex; gap:8px; align-items:center; font-weight:700; font-size:14.5px}
.stok i{width:10px; height:10px; border-radius:50%; background:var(--daun)}
.stok.sedikit i{background:var(--kunyit)} .stok.habis i{background:var(--danger)}
.metatbl{display:grid; grid-template-columns:auto 1fr; gap:6px 18px; font-size:14.5px; border-top:1px solid var(--line); padding-top:14px; width:100%}
.metatbl dt{color:var(--muted)} .metatbl dd{margin:0; font-weight:600}
@media (max-width:860px){ .det{grid-template-columns:1fr; gap:22px} }

/* member page */
.mem{display:grid; grid-template-columns:1fr 1fr; gap:36px; align-items:start; padding-bottom:72px}
.panel-card{background:var(--surface); border-radius:28px; padding:28px}
.panel-card h2{font-size:clamp(1.5rem,2.6vw,2rem); margin-bottom:6px}
.panel-card > p{color:var(--muted); margin:0 0 20px}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label, .field .lbl{font-weight:700; font-size:14px}
.field .hint{font-size:13px; color:var(--muted)}
.in{width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:11px 14px; font-size:16px}
.in:focus{border-color:var(--red); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent)}
textarea.in{min-height:90px; resize:vertical}
select.in{appearance:auto}
.inline-form{display:flex; gap:10px}
.inline-form .in{flex:1}
.msg{font-size:14.5px; margin-top:10px; min-height:1.4em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--daun)}
.benefits{list-style:none; padding:0; margin:0 0 6px; display:grid; gap:12px}
.benefits li{display:flex; gap:12px; align-items:flex-start; font-weight:600}
.benefits li b{flex:none; width:28px; height:28px; border-radius:50%; background:var(--red); color:#fff; display:grid; place-items:center; font-size:13px}
.mcard{position:relative; aspect-ratio:1.586; border-radius:24px; padding:20px 22px; color:#fff; overflow:hidden; background:linear-gradient(135deg,#D6334A,#A91E35); box-shadow:0 30px 60px -30px rgba(120,10,30,.7); display:flex; flex-direction:column; isolation:isolate; max-width:420px; margin-top:16px}
.mcard .mk-woman{position:absolute; right:-24px; bottom:-30px; width:56%; color:rgba(255,255,255,.22); z-index:-1}
.mcard .mk-word{width:92px; color:#fff}
.mcard .who{margin-top:auto}
.mcard .nm{font-family:var(--serif); font-size:clamp(20px,3vw,26px); line-height:1.1}
.mcard .cd{font-size:14px; letter-spacing:.12em; opacity:.85; margin-top:4px}
.mcard .pts{position:absolute; right:22px; bottom:58px; text-align:right}
.mcard .pts b{font-family:var(--serif); font-size:clamp(32px,5vw,44px); font-weight:400; line-height:1; display:block}
.mcard .pts span{font-size:13px; opacity:.9}
.regok{background:color-mix(in srgb,var(--daun) 14%,transparent); border-radius:18px; padding:16px 18px}
@media (max-width:860px){ .mem{grid-template-columns:1fr} }

footer{padding:44px 0 56px; font-size:14.5px; color:var(--muted); border-top:1px solid var(--line); margin-top:0}
footer .wrap{display:flex; gap:24px; justify-content:space-between; flex-wrap:wrap; align-items:flex-start}
footer .brand .mk-woman{width:40px}

/* ---------- dashboard ---------- */
.dash{display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 69px)}
.dside{border-right:1px solid var(--line); padding:20px 12px; position:sticky; top:69px; align-self:start; height:calc(100vh - 69px); overflow:auto}
.dside h3{font-size:12.5px; color:var(--muted); margin:14px 12px 6px; font-weight:700}
.dside button{all:unset; box-sizing:border-box; cursor:pointer; display:flex; justify-content:space-between; align-items:center; width:100%; padding:9px 12px; border-radius:12px; font-weight:600; font-size:15px}
.dside button:hover{background:var(--surface)}
.dside button[aria-current="true"]{background:var(--surface-2); color:var(--red)}
.dside button:focus-visible{outline:3px solid var(--kunyit)}
.dside .cnt{font-size:12px; background:var(--red); color:#fff; border-radius:99px; padding:1px 8px}
.dmain{padding:28px 32px 80px; min-width:0}
.dmain > h1{font-family:var(--serif); font-weight:400; font-size:32px; margin:0 0 4px}
.dmain > .sub{color:var(--muted); margin:0 0 22px}
.dbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.dbar .in{max-width:320px}
.dsel{display:none}
@media (max-width:860px){
  .dash{grid-template-columns:1fr}
  .dside{display:none}
  .dsel{display:block; margin-bottom:16px}
  .dmain{padding:20px 18px 90px}
}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:22px}
.stat{background:var(--surface); border-radius:20px; padding:18px}
.stat b{display:block; font-family:var(--serif); font-weight:400; font-size:34px; line-height:1.05}
.stat span{font-size:14px; color:var(--muted); font-weight:600}
.two{display:grid; grid-template-columns:1fr 1fr; gap:20px}
@media (max-width:980px){ .two{grid-template-columns:1fr} }
.box{background:var(--surface); border-radius:22px; padding:18px 20px}
.box h4{margin:0 0 12px; font-size:16px}
.bars{display:flex; align-items:flex-end; gap:4px; height:150px; padding-top:8px}
.bars div{flex:1; background:var(--red); border-radius:6px 6px 2px 2px; min-height:2px; position:relative}
.bars div:hover{background:var(--red-deep)}
.bars-x{display:flex; gap:4px; font-size:11px; color:var(--muted); margin-top:6px}
.bars-x span{flex:1; text-align:center}
.hbar{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:center; font-size:14.5px}
.hbar .t{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
.hbar .track{grid-column:1 / -1; height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:8px}
.hbar .track i{display:block; height:100%; background:var(--red); border-radius:99px}
.tbl{width:100%; border-collapse:collapse; font-size:14.5px}
.tbl-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:18px}
.tbl th{text-align:left; font-size:13px; color:var(--muted); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .mini{width:44px; height:44px; border-radius:10px; overflow:hidden; flex:none}
.tbl .pn{display:flex; gap:12px; align-items:center; font-weight:700}
.tbl .num{text-align:right; white-space:nowrap}
.icon-btn{border:0; background:transparent; cursor:pointer; padding:6px 9px; border-radius:8px; font-weight:700; font-size:13.5px; color:var(--muted); white-space:nowrap}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}
.icon-btn.del:hover{color:var(--danger)}
.pill{font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--surface-2); white-space:nowrap; display:inline-block}
.pill.ok{background:color-mix(in srgb,var(--daun) 18%,transparent); color:var(--daun)}
.pill.warn{background:color-mix(in srgb,var(--kunyit) 25%,transparent); color:#8A4B00}
.pill.bad{background:color-mix(in srgb,var(--red) 15%,transparent); color:var(--red)}
.list{display:grid; gap:8px}
.li{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
.li.pick{cursor:pointer} .li.pick:hover{border-color:var(--red)}
.li.on{border-color:var(--red); box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 30%,transparent)}
.li .grow{flex:1; min-width:0}
.li .t{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.li .s{font-size:13px; color:var(--muted)}
.li .mini{width:42px; height:42px; border-radius:10px; overflow:hidden; flex:none}
.seg{display:inline-flex; background:var(--surface-2); border-radius:999px; padding:4px; margin-bottom:14px}
.seg button{border:0; background:transparent; padding:8px 16px; border-radius:999px; font-weight:700; cursor:pointer; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card); box-shadow:var(--shadow); color:var(--red)}
.calc{font-size:14.5px; background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:14px; border:1px solid var(--line)}
.calc b{font-size:18px}
.chk{display:flex; gap:10px; align-items:center; font-weight:600; margin-bottom:12px; cursor:pointer}
.chk input{width:19px; height:19px; accent-color:var(--red)}
.sw{display:flex; gap:8px; flex-wrap:wrap}
.sw label{cursor:pointer; position:relative}
.sw input{position:absolute; opacity:0}
.sw span{display:block; width:32px; height:32px; border-radius:50%; border:3px solid var(--bg); box-shadow:0 0 0 1.5px var(--line)}
.sw input:checked + span{box-shadow:0 0 0 3px var(--ink)}
.sw input:focus-visible + span{outline:3px solid var(--kunyit)}
.warn{background:color-mix(in srgb,var(--kunyit) 22%,transparent); border-radius:14px; padding:12px 14px; font-size:14.5px; margin-bottom:16px}
.picker{border:1.5px solid var(--line); border-radius:14px; background:var(--card); max-height:220px; overflow:auto; padding:6px}
.picker label{display:flex; gap:10px; align-items:center; padding:6px 8px; border-radius:10px; cursor:pointer; font-size:14.5px}
.picker label:hover{background:var(--surface)}
.picker input{accent-color:var(--red)}
.order-list{display:grid; gap:6px; margin-bottom:10px}
.actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
@media (max-width:600px){ .grid2{grid-template-columns:1fr} }
dialog.ed{border:0; padding:0; width:min(720px,96vw); max-height:92vh; border-radius:26px; background:var(--bg); color:var(--ink); box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
dialog.ed::backdrop{background:rgba(27,10,16,.55)}
.ed-in{display:flex; flex-direction:column; max-height:92vh}
.ed-head{display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid var(--line)}

.ed-head .x{margin-left:auto; width:40px; height:40px; border-radius:50%; border:0; background:var(--surface); cursor:pointer; font-size:20px}

@media (max-width:640px){ dialog.ed{width:100vw; max-width:100vw; height:100%; max-height:100vh; border-radius:0} .ed-in{max-height:100vh; height:100%} }
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:14px; font-weight:600; z-index:100; opacity:0; transition:.2s; pointer-events:none; max-width:90vw}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.dash-fab{position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:26; box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}

.av{width:26px; height:26px; border-radius:50%; flex:none}

/* hero slider (track) */
.hero-track{display:flex; transition:transform .55s cubic-bezier(.2,.7,.2,1); will-change:transform; touch-action:pan-y}
.slide{flex:0 0 100%; min-width:0; position:relative; background:var(--hb); color:var(--hc); overflow:hidden}
.hero-ctrl{color:#fff}
.hero-ctrl button.dot{box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.hero-ctrl .arr{background:rgba(20,8,12,.28); border:0; color:#fff}
.hcount,.htabs{display:none}

/* member highlight */
nav.main a.nav-member{background:var(--red); color:#fff; font-weight:800; display:inline-flex; align-items:center; gap:7px; position:relative; margin-left:6px; padding:9px 16px}
nav.main a.nav-member:hover{background:var(--red-deep)}
nav.main a.nav-member[aria-current="page"]{color:#fff; box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 30%,transparent)}
.nav-member svg{width:16px; height:16px}
.ping{position:absolute; top:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:var(--kunyit); border:2px solid var(--bg)}
.ping::after{content:""; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--kunyit); animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
.ribbon{background:var(--ink); color:var(--bg)}
.ribbon a{display:flex; align-items:center; justify-content:center; gap:10px; padding:13px 20px; text-decoration:none; font-weight:700; font-size:15px; text-align:center; flex-wrap:wrap}
.ribbon b{color:var(--kunyit)}
.ribbon .go{background:var(--red); color:#fff; padding:5px 12px; border-radius:99px; font-size:13.5px}

/* prices: normal vs member */

.prices small{font-size:11.5px; font-weight:800; margin-right:6px}
.pnorm{font-weight:700; font-size:14.5px; color:var(--muted)}
.pmem{font-weight:800; font-size:17px; color:var(--red)}
.pmem small{color:#fff; background:var(--red); padding:1px 7px; border-radius:99px; vertical-align:2px}
.det-info .pmem{font-size:28px} .det-info .pnorm{font-size:17px}
.memnote{margin:8px 0 0; font-size:14.5px; color:var(--muted)} .memnote a{color:var(--red); font-weight:700}

/* sponsor grid */
.spgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}

/* member page */

document.addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a){e.preventDefault();e.stopPropagation();addToCart(a.dataset.add)}},true);
function cartItems(){return S.cart.map(c=>({...c,p:prodOf(c.id)})).filter(x=>x.p&&x.p.aktif!==false&&!isLocked(x.p))}

const PRIVASI_DEFAULT=`Kebijakan ini menjelaskan data apa yang dikumpulkan Linda Kosmetik lewat website ini, untuk apa data tersebut dipakai, dan apa saja hak kamu.
## Data yang kami kumpulkan
Saat kamu mendaftar member: nama lengkap, nomor WhatsApp, dan email.
Saat kamu checkout: nama, alamat kirim, dan catatan pesanan dikirim lewat WhatsApp. Data ini juga tersimpan di browser kamu supaya tidak perlu diketik ulang.
Saat kamu belanja sebagai member: catatan transaksi poin (jumlah belanja, poin yang bertambah atau ditukar).
Saat kamu membuka website: statistik kunjungan, seperti jumlah kunjungan dan produk yang dilihat atau diklik. Statistik ini dipakai dalam bentuk rekap, bukan untuk melacak orang per orang.
## Untuk apa data dipakai
Mengelola keanggotaan dan poin member.
Memproses pesanan dan pengiriman yang kamu lakukan lewat WhatsApp.
Mengirim info promo lewat WhatsApp. Kamu bisa minta berhenti kapan saja.
Memahami produk apa yang paling diminati supaya katalog makin pas.
## Berbagi data
Linda Kosmetik tidak menjual data pribadi kamu. Data hanya dibagikan bila diperlukan untuk pengiriman pesanan (misalnya ke jasa kurir) atau bila diwajibkan oleh hukum.
## Penyimpanan dan keamanan
Data disimpan selama kamu masih menjadi member atau selama diperlukan untuk tujuan di atas. Akses ke data member dibatasi untuk tim Linda Kosmetik yang berwenang.
## Hak kamu
Kamu bisa meminta untuk melihat, memperbaiki, atau menghapus data kamu, serta berhenti menerima info promo, dengan menghubungi kami lewat WhatsApp.
## Perubahan kebijakan
Kebijakan ini bisa diperbarui sewaktu-waktu. Versi terbaru selalu tersedia di halaman ini.`;

function aggStats(){
  const days=S.range, from=new Date();from.setDate(from.getDate()-days+1);const fromS=from.toISOString().slice(0,10);
  const agg={vis:0,uniq:0,imp:{},det:{},wa:{},byDay:{}};
  S.stats.forEach(s=>{let active=false;Object.entries(s.days||{}).forEach(([d,n])=>{if(d>=fromS){agg.vis+=n;agg.byDay[d]=(agg.byDay[d]||0)+n;active=true}});if(active)agg.uniq++;
    ["imp","det","wa"].forEach(k=>Object.entries(s[k]||{}).forEach(([p,n])=>agg[k][p]=(agg[k][p]||0)+n))});
  return agg;
}
function topList(obj,label){const rows=Object.entries(obj).map(([id,n])=>({p:prodOf(id),n})).filter(r=>r.p).sort((a,b)=>b.n-a.n).slice(0,6);if(!rows.length)return `<p class="muted" style="margin:0">Belum ada data.</p>`;const mx=rows[0].n;return `<div class="hbar">${rows.map(r=>`<span class="t">${esc(r.p.nama)}</span><span>${num(r.n)} ${label}</span><div class="track"><i style="width:${Math.max(4,r.n/mx*100)}%"></i></div>`).join("")}</div>`}

function bindSimple(kind){
  const col=kind==="kategori"?"kategori":"brand", arr=(kind==="kategori"?S.kategori:S.brands).slice().sort(byUrut), key=kind==="kategori"?"kategoriId":"brandId";

  $$("#dmain .li[data-id]").forEach(el=>{const i=arr.findIndex(x=>x._id===el.dataset.id),x=arr[i];
    const swap=async j=>{const y=arr[j];try{await S.db.doc(col+"/"+x._id).update({urutan:j+1});await S.db.doc(col+"/"+y._id).update({urutan:i+1})}catch(e){toast("Gagal mengubah urutan")}};

      $("#sf",root).onsubmit=async e=>{e.preventDefault();const d={nama:$("#sf-n").value.trim()};$("#sf-go").disabled=true;
        try{const f=$("#sf-f")?.files?.[0];if(f){toast("Mengunggah logo…");d.logoId=(await S.assets.upload(f)).id}const w=root.querySelector('input[name="kw"]:checked');if(w)d.warna=w.value;const pk=$("#sf-pk");if(pk)d.pick=pk.checked;
          await S.db.doc(col+"/"+x._id).update(d);log("Mengubah",kind,d.nama);$("#ed").close();toast("Tersimpan")}catch(err){toast("Gagal menyimpan");$("#sf-go").disabled=false}}});
    el.querySelector('[data-act="del"]').onclick=async()=>{const n=S.products.filter(p=>p[key]===x._id).length;if(!confirm(n?`${x.nama} dipakai ${n} produk. Produk tersebut akan tanpa ${kind}. Tetap hapus?`:`Hapus ${x.nama}?`))return;try{await S.db.doc(col+"/"+x._id).delete();log("Menghapus",kind,x.nama);toast("Dihapus")}catch(e){toast("Gagal menghapus")}};
  });

async function normOrder(col,arr){const bad=arr.some((x,i)=>Number(x.urutan)!==i+1);if(!bad)return;for(let i=0;i<arr.length;i++){if(Number(arr[i].urutan)!==i+1){try{await S.db.doc(col+"/"+arr[i]._id).update({urutan:i+1});arr[i].urutan=i+1}catch(e){}}}}

  q.onfocus=run;q.oninput=()=>{clearTimeout(t);t=setTimeout(run,250)};
}
function dAudit(){return `<p class="sub">Catatan setiap perubahan data yang dilakukan lewat dashboard.</p><div class="dbar"><label class="sr" for="au-q">Cari log</label><input class="in" id="au-q" placeholder="Cari aksi atau data"></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th></tr></thead><tbody id="au-rows"><tr><td colspan="3" class="muted">Memuat…</td></tr></tbody></table></div>`}
function bAudit(){
  (async()=>{const rows=S.audit.slice().sort((a,b)=>b.at-a.at).slice(0,200);const ps=await names(rows.map(r=>r.uid));const tb=$("#au-rows");if(!tb)return;
    if(!rows.length){tb.innerHTML=`<tr><td colspan="3" class="muted">Belum ada perubahan tercatat.</td></tr>`;return}
    tb.innerHTML=rows.map(r=>`<tr data-s="${esc([r.aksi,r.objek,r.nama].join(" ").toLowerCase())}"><td style="white-space:nowrap">${new Date(r.at).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})}</td><td data-u="${esc(r.uid)}"></td><td>${esc(r.aksi)} ${esc(r.objek)}${r.nama?`: <b>${esc(r.nama)}</b>`:""}</td></tr>`).join("");
    $$("#au-rows [data-u]").forEach(td=>td.textContent=(ps[td.dataset.u]||{}).name||"Pengguna");
    $("#au-q").oninput=e=>{const v=e.target.value.toLowerCase();$$("#au-rows tr").forEach(r=>r.hidden=!(r.dataset.s||"").includes(v))};
  })();
}

/* info toko */
function dAtur(){const s=S.settings;
  return `<p class="sub">Informasi toko, kontak, dan aturan poin member.</p><form id="at"><div class="two"><div class="box"><h4>Toko & kontak</h4>
  <div class="field"><label for="at-wa">Nomor WhatsApp toko</label><input class="in" id="at-wa" inputmode="tel" placeholder="08xx atau 628xx" value="${esc(s.wa)}"><span class="hint">Semua tombol pesan diarahkan ke nomor ini.</span></div>
  <div class="field"><label for="at-al">Alamat</label><input class="in" id="at-al" value="${esc(s.alamat)}"></div>
  <div class="field"><label for="at-ko">Kota</label><input class="in" id="at-ko" value="${esc(s.kota)}"></div>
  <div class="field"><label for="at-mp">Link Google Maps</label><input class="in" id="at-mp" type="url" value="${esc(s.maps)}"></div>
  <div class="field"><label for="at-jm">Jam buka</label><input class="in" id="at-jm" placeholder="cth. Setiap hari, 08.00–21.00" value="${esc(s.jam)}"></div>
  <div class="field"><label for="at-ig">Instagram</label><input class="in" id="at-ig" placeholder="lindakosmetik" value="${esc(s.instagram)}"></div></div>
  <div class="box"><h4>Member & poin</h4>
  <div class="field"><label for="at-rp">Belanja per 1 poin (Rp)</label><input class="in" id="at-rp" type="number" min="1000" step="1000" value="${esc(s.rupiahPerPoin)}"></div>
  <div class="field"><label for="at-bn">Benefit member (satu per baris)</label><textarea class="in" id="at-bn" style="min-height:120px">${esc(s.benefit)}</textarea></div>
  <div class="field"><label for="at-tk">Pilihan tukar poin (satu per baris)</label><textarea class="in" id="at-tk">${esc(s.tukar)}</textarea></div></div>
  <div class="box"><h4>Cerita Ce Linda</h4>
  <div class="grid2"><div class="field"><label for="at-sj">Berdiri sejak</label><input class="in" id="at-sj" inputmode="numeric" value="${esc(s.sejak||"1991")}"></div><div class="field"><label for="at-tg">Tagline</label><input class="in" id="at-tg" value="${esc(s.tagline||DEFAULTS.tagline)}"></div></div>
  <div class="field"><label for="at-cj">Judul section</label><input class="in" id="at-cj" value="${esc(s.ceJudul||DEFAULTS.ceJudul)}"></div>
  <div class="field"><label for="at-pv">Kebijakan privasi</label><textarea class="in" id="at-pv" style="min-height:160px">${esc(s.privasi||PRIVASI_DEFAULT)}</textarea><span class="hint">Baris yang diawali “## ” jadi subjudul. Ini draf umum, sebaiknya dicek dulu sebelum dipakai resmi.</span></div>
  <div class="field"><label for="at-cq">Kata-kata Ce Linda</label><input class="in" id="at-cq" value="${esc(s.ceQuote??DEFAULTS.ceQuote)}"><span class="hint">Tampil sebagai kutipan besar dan di pita berjalan. Kosongkan untuk menyembunyikan.</span></div>
  <div class="field"><label for="at-cg">Gaya foto</label><select class="in" id="at-cg"><option value="pop" ${(s.ceGaya||"pop")==="pop"?"selected":""}>Pop-art merah (duotone + titik halftone)</option><option value="asli" ${s.ceGaya==="asli"?"selected":""}>Foto asli</option></select></div>
  <div class="field"><label for="at-ct">Cerita singkat</label><textarea class="in" id="at-ct" style="min-height:120px">${esc(s.ceTeks||DEFAULTS.ceTeks)}</textarea></div>
  ${S.assets?`<div class="field"><label for="at-cf">Foto Ce Linda</label><input class="in" type="file" id="at-cf" accept="image/*"><span class="hint">Foto potret (rasio 4:5) paling pas di bingkai polaroid.${s.ceFoto?" Sudah ada foto; pilih file baru untuk mengganti.":""}</span></div>`:""}</div></div>
  <div class="actions" style="margin-top:18px"><button class="btn btn-red">Simpan</button></div></form>`}
function bAtur(){$("#at").onsubmit=async e=>{e.preventDefault();try{await saveSettingsPatch({wa:normHp($("#at-wa").value),alamat:$("#at-al").value.trim(),kota:$("#at-ko").value.trim(),maps:$("#at-mp").value.trim(),jam:$("#at-jm").value.trim(),instagram:$("#at-ig").value.trim().replace(/^@/,""),rupiahPerPoin:Math.max(1000,parseInt($("#at-rp").value)||10000),benefit:$("#at-bn").value.trim(),tukar:$("#at-tk").value.trim(),sejak:$("#at-sj").value.trim()||"1991",tagline:$("#at-tg").value.trim(),ceJudul:$("#at-cj").value.trim(),ceTeks:$("#at-ct").value.trim(),ceQuote:$("#at-cq").value.trim(),privasi:$("#at-pv").value.trim(),ceGaya:$("#at-cg").value,...(await (async()=>{const f=$("#at-cf")?.files?.[0];if(!f)return {};toast("Mengunggah foto…");return {ceFoto:(await S.assets.upload(f)).id}})())});log("Mengubah","info toko","");S.dirty=false;toast("Tersimpan")}catch(err){toast("Gagal menyimpan")}}}

/* ---------- boot ---------- */
route();
(async()=>{
  const C=window.claude;if(!C||!C.use){S.loaded=true;render();return}
  const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
  S.db=db;S.user=user;
  if(!db){S.loaded=true;render();return}
  try{S.uid=user?await user.id():null}catch(e){}
  try{S.admin=user?await user.canEdit():false;S.owner=user?await user.isOwner():false}catch(e){}
  try{const c=user&&user.can?await user.can("data.write"):null;S.canWrite=c!==false&&!!S.uid}catch(e){S.canWrite=!!S.uid}
  try{S.regLocal=JSON.parse(localStorage.getItem("linda-reg")||"null")}catch(e){}
  try{const m=JSON.parse(localStorage.getItem("linda-member")||"null");if(m&&m.kode){const d=await db.doc("kartu/"+m.kode).get();const k=d.exists?d.data():null;if(k&&k.kunci&&k.kunci===m.kunci)S.member={kode:m.kode,panggilan:k.panggilan||m.panggilan,kunci:m.kunci};else localStorage.removeItem("linda-member")}}catch(e){}
  updUnlock();
  let pending=6;const done=()=>{if(--pending===0){S.loaded=true;render();if(S.view==="beranda")schedulePop()}};
  const sub=(col,key,secs,first)=>{let f=true;db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({...d.data(),_id:d.id}));if(f){f=false;first&&first()}if(S.loaded){if(S.view==="dashboard")dashRefresh(secs);else render()}},()=>{if(f){f=false;first&&first()}})};
  db.doc("toko/pengaturan").onSnapshot(d=>{S.settings={...DEFAULTS,...(d.exists?d.data():{})};if(S.loaded){if(S.view==="dashboard")dashRefresh(["atur","banner","poin"]);else render()}},()=>{});
  sub("produk","products",["produk","ringkasan","katalog","kategori","brand","banner"],done);
  sub("kategori","kategori",["kategori","produk","banner"],done);
  sub("brand","brands",["brand","produk","banner"],done);
  sub("katalog","katalog",["katalog"],done);
  sub("banner","banners",["banner"],()=>{done();startBanner()});
  if(S.uid&&!S.admin){try{db.doc("pendaftaran/"+S.uid).onSnapshot(d=>{S.myReg=d.exists?d.data():null;const was=S.unlocked;updUnlock();if(S.view==="member"||was!==S.unlocked)render()},()=>{})}catch(e){}}
  done();
  if(S.admin){
    const [as,dl]=await Promise.all([C.use("assets"),C.use("downloads")]);S.assets=as;S.downloads=dl;
    if(!S.owner&&S.uid){try{const a=await db.doc("akses/"+S.uid).get();if(a.exists)S.role=a.data().peran||"admin"}catch(e){}}
    sub("anggota","anggota",["member","poin","ringkasan"]);
    db.collection("kartu").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.kartu=m;if(S.view==="dashboard"&&!S.writing)dashRefresh(["member","poin"])},()=>{});
    sub("pendaftaran","pendaftaran",["member"]);
    sub("statistik","stats",["ringkasan"]);
    sub("audit","audit",["audit"]);
    sub("akses","akses",["akses"]);
  }
  route();
  trackInit();
})();
})();
</script>
